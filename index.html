<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blinking</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="page">
 
      <div class="left">
        <div class="top">
          <img src="header.png" alt="Blinking" class="header-img">
 
          <h2>A small generative art piece inspired by Hilma af Klint and Wassily Kandinsky.</h2>
 
          <div class="buttons">
            <button id="save-btn" class="img-btn" type="button" aria-label="Save as PNG"></button>
            <button id="refresh-btn" class="img-btn" type="button" aria-label="Refresh"></button>
            <button id="filter-btn" class="img-btn" type="button" aria-label="Filter"></button>
          </div>
        </div>
 
        <div class="credit">
          <p>Experiment by <a href="hamyvu.net" target="_blank">My Vu</a></p>
          <!-- <a href="https://your-website.com" target="_blank">Visit my website</a> -->
           <p> Created with p5js</p>
        </div>
      </div>
 
      <div class="right">
        <div id="canvas-holder"></div>
      </div>
 
    </div>
 
    <script src="sketch.js"></script>
  </body>
</html>
